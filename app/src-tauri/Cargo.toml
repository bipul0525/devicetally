[package]
name = "devicetally-app"
version = "1.2.2"
description = "DeviceTally: AI coding tool usage in your menu bar"
edition = "2021"
license = "MIT"

[lib]
name = "devicetally_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["time"] }
getrandom = "0.3"
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk", "network", "component"] }
starship-battery = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-notification = "2"
base64 = "0.22"

[dev-dependencies]
notify-rust = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSResponder", "NSGraphics", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSFontDescriptor", "NSFont", "NSColor", "NSStringDrawing", "NSAttributedString"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry", "NSDictionary", "NSAttributedString", "NSUserNotification", "NSFileManager", "NSURL", "NSError", "NSBundle"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNNotification", "block2"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
