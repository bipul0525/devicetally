# Builds the DeviceTally tray app (Tauri) for each platform and attaches the installers to the release.
# Unsigned for now (docs/dev/PLAN-desktop.md D5): macOS needs right-click → Open on first launch.
name: App
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - name: Bundle the server (for in-app setup)
        run: npm --prefix ../worker ci && npm run server
      - name: Bundle the agent (sidecar)
        run: npm run agent
        env:
          TARGET: ${{ matrix.target }}
          AGENT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs in-app updates (the app checks this signature before installing). Key: ~/.tauri/devicetally.key
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: app
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: false
          # latest.json is written once by the updater-json job below (parallel writes lost entries).
          uploadUpdaterJson: false
          # Uploading races with the other release jobs (an asset it means to replace can be gone by
          # the time it deletes it: "Not Found"); retry instead of failing the platform.
          retryAttempts: 3

  # The in-app updater's latest.json, written once after every platform has uploaded.
  updater-json:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/updater-json.mjs ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
