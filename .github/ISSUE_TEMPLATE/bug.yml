name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DeviceTally version
      description: In the app's title bar (e.g. 1.0.0)
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS (Apple Silicon), macOS (Intel), Windows, Linux]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
