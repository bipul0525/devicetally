<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How DeviceTally works: each computer's tracker sends usage to your own Cloudflare server; the app shows it.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1320"/><stop offset="1" stop-color="#151b2c"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7aa2ff"/></marker>
  </defs>
  <rect width="960" height="360" rx="20" fill="url(#bg)"/>
  <!-- computers -->
  <g fill="#e8ecf5">
    <text x="40" y="44" font-size="15" font-weight="700" fill="#9aa7c2">YOUR COMPUTERS</text>
    <g transform="translate(40,64)"><rect width="250" height="72" rx="12" fill="#1e2538" stroke="#2f3a55"/><text x="18" y="30" font-size="17" font-weight="700">MacBook Pro</text><text x="18" y="54" font-size="13" fill="#9aa7c2">Claude Code · Codex · menu-bar app</text></g>
    <g transform="translate(40,148)"><rect width="250" height="72" rx="12" fill="#1e2538" stroke="#2f3a55"/><text x="18" y="30" font-size="17" font-weight="700">Mac Studio</text><text x="18" y="54" font-size="13" fill="#9aa7c2">Claude Code · OpenCode</text></g>
    <g transform="translate(40,232)"><rect width="250" height="72" rx="12" fill="#1e2538" stroke="#2f3a55"/><text x="18" y="30" font-size="17" font-weight="700">Work PC</text><text x="18" y="54" font-size="13" fill="#9aa7c2">Windows or Linux</text></g>
  </g>
  <text x="40" y="332" font-size="12.5" fill="#9aa7c2">A small tracker on each: hooks write locally (~1 ms), filtered and uploaded in the background.</text>
  <!-- arrows -->
  <g stroke="#7aa2ff" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M296 100 C 360 100, 360 176, 404 176"/>
    <path d="M296 184 L 404 184"/>
    <path d="M296 268 C 360 268, 360 192, 404 192"/>
  </g>
  <text x="318" y="160" font-size="12" fill="#9aa7c2">usage</text>
  <!-- server -->
  <g transform="translate(410,110)">
    <rect width="230" height="150" rx="16" fill="#1a2a4a" stroke="#3d6bff"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#9db7ff">YOUR SERVER</text>
    <text x="20" y="64" font-size="19" font-weight="800" fill="#ffffff">Cloudflare Worker</text>
    <text x="20" y="88" font-size="19" font-weight="800" fill="#ffffff">+ D1 database</text>
    <text x="20" y="116" font-size="13" fill="#c3cfe8">In your own free account.</text>
    <text x="20" y="134" font-size="13" fill="#c3cfe8">The app creates it for you.</text>
  </g>
  <g stroke="#30d158" stroke-width="2.5" fill="none" marker-end="url(#arr)"><path d="M646 185 L 706 185"/></g>
  <!-- app -->
  <g transform="translate(712,64)">
    <text x="0" y="-20" font-size="15" font-weight="700" fill="#9aa7c2">YOU</text>
    <rect width="210" height="240" rx="16" fill="#1e2538" stroke="#2f3a55"/>
    <rect x="16" y="16" width="178" height="26" rx="8" fill="#0f1320"/>
    <rect x="26" y="23" width="56" height="12" rx="6" fill="#30d158"/><text x="34" y="33" font-size="9.5" font-weight="700" fill="#06260f">✓ Done</text>
    <text x="90" y="33" font-size="10.5" fill="#e8ecf5">48.2M  ↓2.4M  18%</text>
    <text x="18" y="74" font-size="17" font-weight="700" fill="#ffffff">Menu-bar app</text>
    <text x="18" y="100" font-size="13" fill="#c3cfe8">· Usage by tool, model,</text>
    <text x="18" y="118" font-size="13" fill="#c3cfe8">  project and computer</text>
    <text x="18" y="140" font-size="13" fill="#c3cfe8">· Agent status + alerts</text>
    <text x="18" y="162" font-size="13" fill="#c3cfe8">· Device health</text>
    <text x="18" y="184" font-size="13" fill="#c3cfe8">· Storage, prompts</text>
    <text x="18" y="214" font-size="12" fill="#9aa7c2">macOS · Windows · Linux</text>
  </g>
</svg>
